global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Modern SSL configuration
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tlsv12

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend https-in
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/messner.click.pem
    
    # Let's Encrypt ACME Challenge abfangen
    acl is_certbot path_beg /.well-known/acme-challenge/

    # Redirect HTTP to HTTPS
    http-request redirect scheme https unless { ssl_fc } or is_certbot

    # --- PROTECT STRAVA API QUOTA ---
    # Create a stick table to track request rates per IP (100k entries, 30s expiry)
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    
    # Deny if more than 20 requests in 10 seconds (adjust as needed)
    http-request deny deny_status 429 if { sc0_http_req_rate gt 20 }

    # Define Backends (müssen nach den http-request Regeln stehen)
    use_backend certbot if is_certbot
    use_backend strava_mt_backend if { hdr(host) -i strava-mt.messner.click }

backend strava_mt_backend
    # Forwarding to the FastAPI container
    # 'app' is the service name from your docker-compose.yml
    option httpchk GET /health
    http-check expect status 200
    server strava_app app:8000 check inter 10s fall 3 rise 2

# Neues Backend für Certbot
backend certbot
    # init-addr libc,none erlaubt HAProxy zu starten, auch wenn der Container gerade nicht läuft
    server certbot certbot:8080 init-addr libc,none

# Stats Page (optional, accessible via internal IP or restricted)
listen stats
    bind *:8404
    stats enable
    stats uri /monitor
    stats refresh 5s
