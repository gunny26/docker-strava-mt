global
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    daemon

    # Modern SSL configuration
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private
    ssl-default-bind-ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend https-in
    bind *:443 ssl crt /etc/ssl/certs/messner.click.pem allow-0rtt alpn h2,http/1.1

    # --- PROTECT STRAVA API QUOTA ---
    # Create a stick table to track request rates per IP (100k entries, 30s expiry)
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    
    # Deny if more than 20 requests in 10 seconds (adjust as needed)
    http-request deny deny_status 429 if { sc0_http_req_rate gt 20 }

    # Define Backends (müssen nach den http-request Regeln stehen)
    use_backend strava_mt_backend if { hdr(host) -i multi-track-analyzer.messner.click }

backend strava_mt_backend
    # Forwarding to the FastAPI container
    # 'app' is the service name from your docker-compose.yml
    option httpchk GET /health
    http-check expect status 200
    server strava_app app:8000 check inter 10s fall 3 rise 2


# Stats Page (optional, accessible via internal IP or restricted)
listen stats
    bind *:8404
    stats enable
    stats uri /monitor
    stats refresh 5s
